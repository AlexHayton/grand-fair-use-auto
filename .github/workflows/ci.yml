# Continuous integration: run formatting, unit/simulation tests, and Clippy
# on native and wasm32 targets on pushes to main and PRs.
#
# Tests that require a copy of the original game data (`cargo data-test`,
# `cargo oracle-test`) are #[ignore]d by default and are not run in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Keep each job to only the components/targets installed below instead of
  # downloading everything in rust-toolchain.toml on every runner.
  RUSTUP_TOOLCHAIN: stable

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  native:
    name: Test & Clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config lld
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  wasm:
    name: Wasm32 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          cache-on-failure: true
      - name: Run Clippy for wasm32
        run: cargo clippy --target wasm32-unknown-unknown --workspace --exclude gfa-native --exclude gfa-tool -- -D warnings
