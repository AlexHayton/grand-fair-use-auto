# Continuous integration: run the unit/simulation tests, Clippy on native and
# wasm32 targets, and the wasm32 build check on pushes to main and PRs.
#
# Tests that require a copy of the original game data (`cargo data-test`,
# `cargo oracle-test`) are #[ignore]d by default and are not run in CI.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    name: Wasm32 check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Check wasm32 crates
        run: cargo wasm-check
      - name: Run Clippy for wasm32
        run: cargo clippy --target wasm32-unknown-unknown --workspace --exclude gfa-native --exclude gfa-tool -- -D warnings
