# The web app on GitHub Pages: build the bundle (tools/web/build.sh) on each
# push to main and publish it. The bundle holds no game data; players select
# their own archive in the page.
#
# Turn it on once in the repository: Settings > Pages > Source: GitHub Actions.
name: Web app on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          cache-on-failure: true
      - name: Build the bundle
        run: sh tools/web/build.sh
        env:
          # A project site lives under /<repository>/.
          PUBLIC_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/gfa-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
