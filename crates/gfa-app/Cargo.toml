[package]
name = "gfa-app"
description = "The game shell shared by the native and web builds: window, states, input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gfa-assets.workspace = true
gfa-formats.workspace = true
gfa-sim.workspace = true
gfa-render.workspace = true
gfa-audio.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
log.workspace = true
web-time.workspace = true
winit = { workspace = true, features = ["serde"] }
serde.workspace = true
toml.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
png.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "0.43", features = ["serialize"] }
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Blob", "Document", "Element", "HtmlCanvasElement", "Location", "Window"] }
