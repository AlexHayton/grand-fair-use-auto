[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
# Our crates
gfa-fixed = { path = "crates/gfa-fixed" }
gfa-formats = { path = "crates/gfa-formats" }
gfa-sim = { path = "crates/gfa-sim" }
gfa-assets = { path = "crates/gfa-assets" }
gfa-render = { path = "crates/gfa-render" }
gfa-audio = { path = "crates/gfa-audio" }
gfa-app = { path = "crates/gfa-app" }

# Platform and rendering
# WebGL2 limits everywhere (Principle 5). Native backends here; the web build
# adds "webgl" in gfa-render. WebGPU is deliberately not enabled.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
winit = "0.30"
pollster = "1"
# Debug overlay. Without default features: no clipboard or links, and the
# wgpu backends stay the ones chosen above.
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }

# Audio
kira = { version = "0.12", default-features = false, features = ["cpal", "ogg", "vorbis", "wav", "pcm"] }

# Web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
web-time = "1"

# General
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
png = "0.18"

# Reading the game from the archive it came in (gfa-assets/src/archive).
# rars: RAR 5's LZ decoder only; without its defaults there is no writer,
# encryption, recovery or threads.
rars = { version = "0.13", default-features = false }
miniz_oxide = "0.8"
crc32fast = "1.5"
js-sys = "0.3"
# The desktop's file dialog, when no game is found next to the program.
rfd = "0.18"

# Debug builds are unplayable with unoptimised wgpu and decoders; optimise
# dependencies but keep our own code quick to rebuild and easy to debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
