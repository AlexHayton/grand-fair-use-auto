[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[workspace.dependencies]
# Our crates
gfa-formats = { path = "crates/gfa-formats" }
gfa-assets = { path = "crates/gfa-assets" }
gfa-render = { path = "crates/gfa-render" }
gfa-app = { path = "crates/gfa-app" }

# Platform and rendering
# WebGL2 limits everywhere (Principle 5). Native backends here; the web build
# adds "webgl" in gfa-render. WebGPU is deliberately not enabled.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12"] }
winit = "0.30"
pollster = "1"

# Web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_log = "1"
console_error_panic_hook = "0.1"
web-time = "1"

# General
log = "0.4"
env_logger = "0.11"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }

# Debug builds are unplayable with unoptimised wgpu and decoders; optimise
# dependencies but keep our own code quick to rebuild and easy to debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
